<!-- Sound Module Card Component (Typewriter Terminal Style) -->
<div class="sound-module-card" id="demo-sound-module">
  <div class="sound-module-vinyl">
    <div class="vinyl-center"></div>
  </div>

  <div class="sound-module-info">
    <div class="sound-module-title">{{ title | default('Midnight Echoes') }}</div>
    <div class="sound-module-artist">{{ artist | default('The Boys Band') }} • {{ duration | default('3:42') }}</div>
    
    <!-- Frequency Waveform -->
    <div class="sound-waveform">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
  </div>

  <button class="sound-play-orb" onclick="toggleSpatialTrack(this)" title="Слушать трек">
    <svg viewBox="0 0 24 24">
      <polygon points="5 3 19 12 5 21 5 21"></polygon>
    </svg>
  </button>
</div>
