{% extends "base.html" %}
{% block title %}Boysic{% endblock %}
{% block body %}
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M11 18V4l10-2v14"/></g></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</svg>

<div class="app-shell" id="app" data-user-id="{{ user.id }}" data-user-login="{{ user.login }}">
  <aside class="rail">
    <a class="rail-brand" href="/music" hx-get="/music" hx-target="#main" hx-push-url="true" aria-label="Boysic">
      <img src="/static/img/logo.jpg" alt="">
    </a>
    <nav class="rail-nav" aria-label="Разделы">
      <a class="rail-link" href="/music" hx-get="/music" hx-target="#main" hx-push-url="true" data-nav="/music"
         {% if active == 'music' %}aria-current="page"{% endif %}>
        <svg><use href="#i-music"/></svg><span>Музыка</span>
      </a>
      <a class="rail-link" href="/chats" hx-get="/chats" hx-target="#main" hx-push-url="true" data-nav="/chats"
         {% if active == 'chats' %}aria-current="page"{% endif %}>
        <svg><use href="#i-chat"/></svg><span>Чаты</span>
      </a>
    </nav>
    <div class="rail-spacer"></div>
    <div class="rail-user">
      <div class="avatar avatar-sm" aria-hidden="true">{{ user.login[:2] }}</div>
      <span class="rail-user-login" title="{{ user.login }}">{{ user.login }}</span>
      <button class="rail-logout" type="button" data-action="logout">Выйти</button>
    </div>
  </aside>

  <div class="app-main">
    <div class="conn-banner" id="conn-banner" role="status" hidden>Переподключение…</div>

    <main class="viewport" id="main" hx-history-elt>
      {% include fragment %}
    </main>

    <div class="player is-idle" id="player">
      <audio id="player-audio" preload="metadata"></audio>
      <div>
        <div class="player-title" id="player-title">Трек не выбран</div>
        <div class="player-artist" id="player-artist"></div>
      </div>
      <div class="player-seek">
        <button class="play-btn" id="player-toggle" type="button" aria-label="Воспроизвести / пауза" disabled>
          <svg class="icon-play"><use href="#i-play"/></svg>
          <svg class="icon-pause"><use href="#i-pause"/></svg>
        </button>
        <span class="player-time" id="player-current">0:00</span>
        <input id="player-seek" type="range" min="0" max="0" step="1" value="0" aria-label="Перемотка" disabled>
        <span class="player-time" id="player-total">0:00</span>
      </div>
      <label class="player-volume">
        <span class="sr-only">Громкость</span>
        <input id="player-volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Громкость">
      </label>
    </div>
  </div>
</div>

<dialog class="modal" id="modal" aria-labelledby="modal-title">
  <div class="modal-head">
    <h2 id="modal-title"></h2>
    <button class="modal-close" type="button" data-action="close-modal" aria-label="Закрыть">&times;</button>
  </div>
  <div class="modal-body" id="modal-body"></div>
</dialog>

<script src="/static/js/htmx.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
{% endblock %}
