<section class="page" id="catalog-root">
  <div class="page-head">
    <h1>Каталог треков</h1>
    <p>Найдите трек по названию или исполнителю, запустите его или отправьте в чат карточкой.</p>
  </div>
  <input class="field" id="catalog-search" type="search" placeholder="Название или исполнитель" autocomplete="off" aria-label="Поиск треков">
  <div class="track-list" id="catalog-list" aria-live="polite"></div>
  <p class="empty" id="catalog-empty" hidden></p>
</section>
