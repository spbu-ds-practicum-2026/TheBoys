<!-- Telegram & Discord Slide-Out Drawer (Clean Typewriter Edition, No Unread Clutter, No Tracks) -->
<aside class="dialogs-drawer-panel" id="dialogs-drawer">
  <!-- Top Search Bar (Icon-Only, Clean Typewriter) -->
  <div class="drawer-top-bar">
    <div class="deck-search">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="deck-search-input typewriter-input" placeholder="Поиск сообщений..." oninput="handleSearchDialogs(this.value)">
    </div>

    <!-- Collapse Drawer Icon Button -->
    <button class="drawer-close-btn" onclick="toggleDialogsDrawer(false)" title="Скрыть панель (Ctrl+B)">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Clean Filter Pills (No unread or tracks clutter) -->
  <div class="deck-filter-chips">
    <button class="filter-chip active" onclick="filterDialogs(this, 'all')">Все диалоги</button>
    <button class="filter-chip" onclick="filterDialogs(this, 'direct')">Личные</button>
    <button class="filter-chip" onclick="filterDialogs(this, 'groups')">Каналы</button>
  </div>

  <!-- Dialog Stream (Click to Switch Chats!) -->
  <div class="deck-list" id="dialogs-deck-list">
    <!-- Dialog 1: Alice (Active) - Distinct Violet Avatar -->
    <div class="deck-item active" data-chat-id="1" onclick="selectChat(1)">
      <div class="deck-item-avatar avatar-alice">
        АС
        <span class="deck-presence-dot online"></span>
      </div>
      <div class="deck-item-body">
        <div class="deck-item-top">
          <span class="deck-item-name">Алиса Смирнова</span>
          <span class="deck-item-time">19:42</span>
        </div>
        <div class="deck-item-bottom">
          <span class="deck-item-preview">Привет! Проверила доставку сообщений...</span>
        </div>
      </div>
    </div>

    <!-- Dialog 2: Oleg - Distinct Emerald Avatar -->
    <div class="deck-item" data-chat-id="2" onclick="selectChat(2)">
      <div class="deck-item-avatar avatar-oleg">
        ОИ
        <span class="deck-presence-dot online"></span>
      </div>
      <div class="deck-item-body">
        <div class="deck-item-top">
          <span class="deck-item-name">Олег Иванов</span>
          <span class="deck-item-time">19:30</span>
        </div>
        <div class="deck-item-bottom">
          <span class="deck-item-preview">Слушай, а вложения теперь отправляются?</span>
        </div>
      </div>
    </div>

    <!-- Dialog 3: Pavel - Distinct Sky Blue Avatar -->
    <div class="deck-item" data-chat-id="3" onclick="selectChat(3)">
      <div class="deck-item-avatar avatar-pavel">
        ПГ
        <span class="deck-presence-dot offline"></span>
      </div>
      <div class="deck-item-body">
        <div class="deck-item-top">
          <span class="deck-item-name">Павел Григорьев</span>
          <span class="deck-item-time">18:12</span>
        </div>
        <div class="deck-item-bottom">
          <span class="deck-item-preview">Схему БД зафиксировал</span>
        </div>
      </div>
    </div>

    <!-- Dialog 4: Artem - Distinct Amber Gold Avatar -->
    <div class="deck-item" data-chat-id="4" onclick="selectChat(4)">
      <div class="deck-item-avatar avatar-artem">
        АЕ
        <span class="deck-presence-dot online"></span>
      </div>
      <div class="deck-item-body">
        <div class="deck-item-top">
          <span class="deck-item-name">Артём Еременко</span>
          <span class="deck-item-time">17:55</span>
        </div>
        <div class="deck-item-bottom">
          <span class="deck-item-preview">Docker Compose стенд поднят</span>
        </div>
      </div>
    </div>
  </div>
</aside>
