<!-- Telegram & Discord Slide-Out Drawer (1-on-1 Dialogs with Unread Badges) -->
<aside class="dialogs-drawer-panel" id="dialogs-drawer">
  <!-- Top Bar: Search and New Dialog Button -->
  <div class="drawer-top-bar">
    <div class="deck-search">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input 
        type="text" 
        class="deck-search-input typewriter-input" 
        id="dialogs-search-input"
        placeholder="Search contacts..." 
        data-ru="Поиск собеседника..." 
        data-i18n-placeholder="search_dialogs_placeholder" 
        oninput="handleSearchDialogs(this.value)"
      >
    </div>

    <!-- New Dialog / Find User by Login (TR 1.8: "Алиса находит Боба по логину и открывает диалог с ним") -->
    <button 
      class="drawer-new-chat-btn" 
      id="btn-open-user-search" 
      onclick="openUserSearchModal()"
      title="Найти собеседника по логину / New Dialog"
      data-i18n-title="new_dialog_tooltip"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7" r="4"></circle>
        <line x1="20" y1="8" x2="20" y2="14"></line>
        <line x1="23" y1="11" x2="17" y2="11"></line>
      </svg>
    </button>

    <!-- Collapse Drawer Icon Button -->
    <button class="drawer-close-btn" onclick="toggleDialogsDrawer(false)" title="Hide drawer (Ctrl+B)" data-ru="Скрыть панель (Ctrl+B)" data-i18n-title="hide_drawer">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Filter Chips (TR: All Dialogs are 1-on-1 between 2 users per TR Section 1.8) -->
  <div class="deck-filter-chips">
    <button class="filter-chip active" id="filter-chip-all" onclick="filterDialogs(this, 'all')" data-i18n="filter_all" data-ru="Все">All</button>
    <button class="filter-chip" id="filter-chip-unread" onclick="filterDialogs(this, 'unread')" data-i18n="filter_unread" data-ru="Непрочитанные">Unread</button>
  </div>

  <!-- Dialogs Stream (TR FT6: Online status and Unread Message Counters) -->
  <div class="deck-list" id="dialogs-deck-list" role="listbox" aria-label="Dialogs List">
    {% for dialog in dialogs %}
    <div 
      class="deck-item {% if dialog.id == 1 %}active{% endif %}" 
      data-chat-id="{{ dialog.id }}"
      data-name="{{ dialog.name | lower }}"
      data-handle="{{ dialog.handle | lower }}"
      data-unread="{{ dialog.unread_count }}"
      tabindex="0"
      role="option"
      aria-selected="{% if dialog.id == 1 %}true{% else %}false{% endif %}"
      onclick="selectChat({{ dialog.id }})"
      onkeydown="if(event.key==='Enter'||event.key===' ') { selectChat({{ dialog.id }}); event.preventDefault(); }"
    >
      <div class="deck-item-avatar avatar-gray" id="deck-avatar-{{ dialog.id }}">
        {{ dialog.initials }}
        <span class="deck-presence-dot {{ dialog.status }}"></span>
      </div>

      <div class="deck-item-body">
        <div class="deck-item-top">
          <span class="deck-item-name" data-chat-name="{{ dialog.id }}">{{ dialog.name }}</span>
          <span class="deck-item-time">{{ dialog.last_time }}</span>
        </div>
        <div class="deck-item-bottom">
          <span class="deck-item-preview" data-chat-preview="{{ dialog.id }}">{{ dialog.last_message }}</span>
          {% if dialog.unread_count > 0 %}
          <span class="deck-unread-badge" id="deck-unread-badge-{{ dialog.id }}">{{ dialog.unread_count }}</span>
          {% else %}
          <span class="deck-unread-badge" id="deck-unread-badge-{{ dialog.id }}" style="display: none;">0</span>
          {% endif %}
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</aside>
