events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Map Upgrade header for WebSocket reverse proxying
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # Embedded Docker DNS resolver with 5s TTL for dynamic service discovery
        resolver 127.0.0.11 valid=5s ipv6=off;

        # Security check (TR requirement):
        # /internal/* must never be accessible from the outside.
        location ^~ /internal/ {
            return 403 "Forbidden: internal cluster APIs are restricted from outside access.\n";
        }

        # Health check for load balancer itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # Application reverse proxy (HTTP & WebSocket)
        location / {
            # Storing the backend hostname in a variable forces Nginx to respect DNS TTL
            set $app_upstream "app:8000";
            proxy_pass http://$app_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout for WebSocket sessions
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
