<!-- Spatial Player Placeholder Screen -->
<div class="placeholder-stage glass-panel">
  <div class="placeholder-container">
    <div class="placeholder-header">
      <div class="placeholder-badge">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="8" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M11 18V4l10-2v14"/>
        </svg>
        <span data-i18n="player_badge" data-ru="Аудио-модуль">Audio Module</span>
      </div>
      <h1 class="placeholder-title" data-i18n="player_title" data-ru="Плеер">Music Player</h1>
      <p class="placeholder-desc" data-i18n="player_desc" data-ru="Глобальный аудиоплеер с непрерывным воспроизведением треков во время навигации и переписки">Global audio player with seamless background playback during messaging and navigation</p>
    </div>

    <!-- Spatial Player Console Preview -->
    <div class="player-console-card">
      <!-- Vinyl Turntable Preview -->
      <div class="turntable-deck">
        <div class="turntable-vinyl">
          <div class="turntable-vinyl-grooves"></div>
          <div class="turntable-center-label"></div>
        </div>
      </div>

      <!-- Now Playing Info -->
      <div class="player-track-meta">
        <div class="player-now-badge" data-i18n="player_now_playing" data-ru="СЕЙЧАС ИГРАЕТ">NOW PLAYING</div>
        <div class="player-track-name">Midnight Echoes</div>
        <div class="player-track-artist">The Boys Band • Single (2026)</div>
        
        <!-- Scrub Bar -->
        <div class="player-scrub-bar">
          <div class="player-scrub-progress" style="width: 38%;"></div>
        </div>
        <div class="player-time-row">
          <span>01:24</span>
          <span>03:42</span>
        </div>

        <!-- Tactile Controls Row -->
        <div class="player-controls-row">
          <button class="tactile-btn" style="width: 38px; height: 38px; padding: 0;" title="Shuffle" data-ru="Перемешать" data-i18n-title="player_shuffle">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M16 3h5v5M4 20l17-17M21 16v5h-5M15 15l6 6M4 4l5 5"/>
            </svg>
          </button>
          
          <button class="tactile-btn" style="width: 44px; height: 44px; padding: 0;" title="Previous" data-ru="Предыдущий" data-i18n-title="player_prev">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="3"></line>
            </svg>
          </button>

          <button class="player-main-play-btn" onclick="toggleConsolePlay(this)" title="Play / Pause" data-ru="Воспроизведение / Пауза" data-i18n-title="player_play_pause">
            <svg viewBox="0 0 24 24" class="play-svg" width="20" height="20" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>

          <button class="tactile-btn" style="width: 44px; height: 44px; padding: 0;" title="Next" data-ru="Следующий" data-i18n-title="player_next">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3"></line>
            </svg>
          </button>

          <button class="tactile-btn" style="width: 38px; height: 38px; padding: 0;" title="Repeat" data-ru="Повтор" data-i18n-title="player_repeat">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Notice footer -->
    <div class="placeholder-footer-note">
      <span class="cluster-dot"></span>
      <span data-i18n="player_footer_note" data-ru="Треки распределены в 2 копиях на узлах storage-1 и storage-2. Стриминг через HTTP /blobs/{id}">Tracks replicated across 2 nodes (<code>storage-1</code>, <code>storage-2</code>). Streaming via HTTP <code>/blobs/{id}</code></span>
    </div>
  </div>
</div>
