<!-- Spatial Dialog Deck (Floating Left Module) -->
<aside class="dialog-deck glass-card">
  <!-- Deck Header -->
  <div class="deck-header">
    <span class="deck-title">Диалоги</span>
    <button class="tactile-btn" style="padding: 6px 12px; font-size: 12px;" title="Новый диалог">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Новый</span>
    </button>
  </div>

  <!-- Search Capsule -->
  <div class="deck-search">
    <svg viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" class="deck-search-input" placeholder="Поиск собеседника...">
  </div>

  <!-- Quick Filter Chips -->
  <div class="deck-filter-chips">
    <button class="filter-chip active" onclick="filterDialogs(this, 'all')">Все</button>
    <button class="filter-chip" onclick="filterDialogs(this, 'tracks')">🎵 С треками</button>
    <button class="filter-chip" onclick="filterDialogs(this, 'unread')">Непрочитанные (3)</button>
  </div>

  <!-- Dialog Stream -->
  <div class="deck-list">
    <!-- Dialog 1: Alice (Active) -->
    <div class="deck-item active" data-chat-id="1" onclick="selectSpatialDialog(this, 'Алиса Смирнова', 'online', 'АС')">
      <div class="deck-item-avatar" style="background: var(--gradient-sunset);">
        АС
        <span class="deck-presence-dot"></span>
      </div>
      <div class="deck-item-body">
        <div class="deck-item-top">
          <span class="deck-item-name">Алиса Смирнова</span>
          <span class="deck-item-time">19:42</span>
        </div>
        <div class="deck-item-bottom">
          <span class="deck-item-preview">🎵 Midnight Echoes</span>
          <span style="font-size: 11px; color: var(--accent-peach);">• Трек</span>
        </div>
      </div>
    </div>

    <!-- Dialog 2: Oleg -->
    <div class="deck-item" data-chat-id="2" onclick="selectSpatialDialog(this, 'Олег Иванов', 'online', 'ОИ')">
      <div class="deck-item-avatar" style="background: #181820; border-color: rgba(255, 157, 121, 0.4);">
        ОИ
        <span class="deck-presence-dot"></span>
      </div>
      <div class="deck-item-body">
        <div class="deck-item-top">
          <span class="deck-item-name">Олег Иванов</span>
          <span class="deck-item-time">19:30</span>
        </div>
        <div class="deck-item-bottom">
          <span class="deck-item-preview">Слушай, а трек синхронизируется?</span>
          <span class="deck-item-badge">2</span>
        </div>
      </div>
    </div>

    <!-- Dialog 3: Pavel -->
    <div class="deck-item" data-chat-id="3" onclick="selectSpatialDialog(this, 'Павел Григорьев', 'offline', 'ПГ')">
      <div class="deck-item-avatar" style="background: #121216;">
        ПГ
        <span class="deck-presence-dot offline"></span>
      </div>
      <div class="deck-item-body">
        <div class="deck-item-top">
          <span class="deck-item-name">Павел Григорьев</span>
          <span class="deck-item-time">18:12</span>
        </div>
        <div class="deck-item-bottom">
          <span class="deck-item-preview">Схему БД зафиксировал</span>
        </div>
      </div>
    </div>

    <!-- Dialog 4: Artem -->
    <div class="deck-item" data-chat-id="4" onclick="selectSpatialDialog(this, 'Артём Еременко', 'online', 'АЕ')">
      <div class="deck-item-avatar" style="background: #201a18; border-color: rgba(255, 85, 36, 0.35);">
        АЕ
        <span class="deck-presence-dot"></span>
      </div>
      <div class="deck-item-body">
        <div class="deck-item-top">
          <span class="deck-item-name">Артём Еременко</span>
          <span class="deck-item-time">17:55</span>
        </div>
        <div class="deck-item-bottom">
          <span class="deck-item-preview">Docker Compose стенд поднят</span>
          <span class="deck-item-badge">1</span>
        </div>
      </div>
    </div>
  </div>
</aside>
