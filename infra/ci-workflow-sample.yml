name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/app/requirements-dev.txt

      - name: Run contract and unit tests
        env:
          INTERNAL_SECRET: "ci-dummy-internal-secret-32bytes"
          SESSION_SECRET: "ci-dummy-session-secret-32bytes"
        run: |
          pytest services/app/tests/ -v

  docker-lint-and-build:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_DB: theboys
          POSTGRES_USER: theboys_user
          POSTGRES_PASSWORD: theboys_secret_pass
          INTERNAL_SECRET: "ci-dummy-internal-secret-32bytes"
          SESSION_SECRET: "ci-dummy-session-secret-32bytes"
        run: |
          docker compose config

      - name: Test Nginx configuration syntax
        run: |
          docker run --rm -v $(pwd)/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.27-alpine nginx -t

      - name: Build Application Node Docker Image
        run: |
          docker build -t theboys-app:ci -f services/app/Dockerfile .
